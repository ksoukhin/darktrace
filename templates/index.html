<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Calculator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;font-family:Arial,sans-serif}
body{background:#050805;color:#d8ffd8}
.hidden{display:none!important}

.calculator-screen{
 width:100%;height:100vh;background:#f2f2f2;
 display:flex;align-items:center;justify-content:center;
}
.calculator{
 width:340px;background:#222;border-radius:22px;padding:20px;
 box-shadow:0 15px 45px #0005;
}
.calc-display{
 width:100%;height:75px;border:0;border-radius:12px;
 margin-bottom:16px;padding:10px 14px;text-align:right;
 font-size:30px;background:#eee;color:#111;outline:none;
}
.calc-buttons{
 display:grid;grid-template-columns:repeat(4,1fr);gap:10px;
}
.calc-buttons button{
 height:62px;border:0;border-radius:14px;
 font-size:22px;cursor:pointer;background:#444;color:#fff;
}
.calc-buttons button:hover{filter:brightness(1.12)}
.calc-buttons .op{background:#ff9500}
.calc-buttons .clear{background:#777}
.calc-buttons .equal{background:#ff9500;grid-row:span 2;height:134px}
.calc-buttons .zero{grid-column:span 2}

#login-screen{
 min-height:100vh;background:#050805;display:flex;
 align-items:center;justify-content:center;padding:20px;
}
.login-box{
 width:420px;max-width:100%;border:1px solid #194d19;
 background:#071007;padding:28px;box-shadow:0 0 35px #00ff5520;
}
.logo{font-size:25px;color:#62ff62;letter-spacing:2px;margin-bottom:8px}
.subtitle{font-size:12px;color:#5d995d;margin-bottom:24px}
.login-box input{
 width:100%;padding:13px;margin:7px 0;background:#020402;
 border:1px solid #194d19;color:#9cff9c;outline:none;
}
.login-box button{
 width:100%;padding:13px;margin-top:12px;
 background:#0b260b;border:1px solid #35b735;color:#72ff72;
 cursor:pointer;font-weight:bold;
}
#error{color:#ff5f5f;font-size:12px;margin-top:12px}

#chat-screen{min-height:100vh;background:#050805}
.banner{
 height:54px;border-bottom:1px solid #123512;
 display:flex;align-items:center;padding:0 15px;
 color:#58ff58;font-size:12px;letter-spacing:1px;
}
.banner .agent{margin-left:auto;margin-right:12px;color:#8edb8e}
.menu-btn{
 border:1px solid #255b25;background:#081108;color:#72ff72;
 width:34px;height:32px;font-size:22px;cursor:pointer;
}
.layout{display:flex;height:calc(100vh - 54px)}
.sidebar{
 width:250px;border-right:1px solid #123512;
 background:#071007;padding:18px;
}
.sidebar h3{font-size:13px;color:#62ff62;margin:0 0 20px}
.side-label{font-size:10px;color:#518551;margin-top:18px}
.online-count{font-size:28px;color:#70ff70;margin-top:5px}
.online-users{margin-top:8px}
.online-user{
 font-size:12px;color:#9ddd9d;padding:5px 0;
 border-bottom:1px solid #102510;
}
.warning{
 margin-top:25px;padding:10px;border:1px solid #513d08;
 color:#d8b742;font-size:10px;
}
.status{font-size:11px;color:#6b9b6b;line-height:1.8}

.chat{flex:1;display:flex;flex-direction:column;min-width:0}
.chat-head{
 height:55px;border-bottom:1px solid #123512;
 padding:18px;color:#67ff67;font-size:12px;
}
.messages{
 flex:1;overflow-y:auto;padding:18px;
 display:flex;flex-direction:column;gap:15px;
}
.message{
 max-width:75%;align-self:flex-start;
 background:#0b150b;border:1px solid #173d17;
 padding:10px 13px;color:#b5ffb5;
}
.message.mine{
 align-self:flex-end;background:#102410;border-color:#286328;
}
.message.system{
 align-self:center;max-width:90%;
 background:transparent;border:0;color:#4f944f;
 font-size:11px;text-align:center;
}
.sender{font-size:10px;color:#63d663;margin-bottom:5px}
.text{font-size:13px;word-wrap:break-word}
.input-area{
 display:flex;padding:12px;border-top:1px solid #123512;gap:8px;
}
.input-area input{
 flex:1;background:#020402;border:1px solid #194d19;
 color:#baffba;padding:12px;outline:none;
}
.input-area button{
 background:#0b260b;border:1px solid #35b735;
 color:#72ff72;padding:0 20px;cursor:pointer;
}
.panic{
 position:fixed;bottom:15px;right:15px;
 background:#190707;border:1px solid #7b2020;
 color:#ff5c5c;padding:8px 12px;font-size:10px;cursor:pointer;
}

.mobile-backdrop{display:none}

@media(max-width:700px){
 .sidebar{
  position:fixed;left:-270px;top:54px;bottom:0;
  z-index:20;transition:.25s;width:250px;
 }
 .sidebar.open{left:0}
 .mobile-backdrop{
  position:fixed;inset:54px 0 0;background:#0008;z-index:10;
 }
 .mobile-backdrop.show{display:block}
 .banner{font-size:9px}
 .banner .agent{font-size:9px}
 .message{max-width:85%}
}
</style>
</head>
<body>

<div id="calculator-screen" class="calculator-screen">
 <div class="calculator">
  <input id="calc-display" class="calc-display" value="0" readonly>
  <div class="calc-buttons">
   <button class="clear" onclick="clearCalc()">C</button>
   <button class="clear" onclick="backspace()">⌫</button>
   <button class="op" onclick="press('/')">÷</button>
   <button class="op" onclick="press('*')">×</button>

   <button onclick="press('7')">7</button>
   <button onclick="press('8')">8</button>
   <button onclick="press('9')">9</button>
   <button class="op" onclick="press('-')">−</button>

   <button onclick="press('4')">4</button>
   <button onclick="press('5')">5</button>
   <button onclick="press('6')">6</button>
   <button class="op" onclick="press('+')">+</button>

   <button onclick="press('1')">1</button>
   <button onclick="press('2')">2</button>
   <button onclick="press('3')">3</button>
   <button class="equal" onclick="calculate()">=</button>

   <button class="zero" onclick="press('0')">0</button>
   <button onclick="press('.')">.</button>

   <button onclick="press('(')">(</button>
   <button onclick="press(')')">)</button>
  </div>
 </div>
</div>

<div id="login-screen" class="hidden">
 <div class="login-box">
  <div class="logo">DARKTRACE</div>
  <div class="subtitle">SECURE INTELLIGENCE NETWORK // V4.2</div>

  <input id="agent" placeholder="AGENT IDENTIFIER">
  <input id="room" placeholder="SECURE CHANNEL">
  <input id="password" type="password" placeholder="CLEARANCE PASSWORD">

  <button onclick="verify()">ESTABLISH CONNECTION</button>
  <div id="error"></div>
 </div>
</div>

<div id="chat-screen" class="hidden">
 <div class="banner">
  [STATUS: CLASSIFIED] // SYSTEM: DARKTRACE V4.2
  <span class="agent" id="active-agent"></span>
  <button class="menu-btn" onclick="toggleSidebar()">⋮</button>
 </div>

 <div class="layout">
  <aside class="sidebar" id="sidebar">
   <h3>OPS BRIEFING</h3>

   <div class="side-label">CHANNEL:</div>
   <div id="side-room">---</div>

   <div class="side-label">ONLINE:</div>
   <div class="online-count" id="online-count">0</div>
   <div id="online-users" class="online-users"></div>

   <div class="side-label">PROTOCOL:</div>
   <div class="status">E2EE SIMULATED</div>

   <div class="warning">DO NOT TRANSMIT CLASSIFIED DATA.</div>

   <div class="side-label">SYSTEM STATUS:</div>
   <div class="status">
    CONNECTION: ACTIVE<br>
    CHANNEL: ENCRYPTED<br>
    DARKTRACE V4.2
   </div>
  </aside>

  <div class="mobile-backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <main class="chat">
   <div class="chat-head">SECURE CHANNEL: <span id="chat-room">---</span></div>

   <div class="messages" id="messages"></div>

   <div class="input-area">
    <input id="message-input" placeholder="ENTER SECURE MESSAGE..." autocomplete="off">
    <button onclick="sendMessage()">SEND</button>
   </div>
  </main>
 </div>

 <button class="panic" onclick="triggerPanic()">[PANIC JUMP]</button>
</div>

<script>
const $=id=>document.getElementById(id);
const socket=io();

let calc='';
let currentRoom='';
let currentAgent='';

function press(v){
 calc+=v;
 $('calc-display').value=calc||'0';
}

function clearCalc(){
 calc='';
 $('calc-display').value='0';
}

function backspace(){
 calc=calc.slice(0,-1);
 $('calc-display').value=calc||'0';
}

function calculate(){
 if(calc.replace(/\s/g,'')==='19+33'){
  $('calculator-screen').classList.add('hidden');
  $('login-screen').classList.remove('hidden');
  calc='';
  $('calc-display').value='0';
  return;
 }

 try{
  if(!/^[0-9+\-*/().\s]+$/.test(calc))throw 0;
  let result=Function('"use strict";return('+calc+')')();
  if(!Number.isFinite(result))throw 0;
  $('calc-display').value=result;
  calc=String(result);
 }catch{
  $('calc-display').value='Error';
  calc='';
 }
}

function verify(){
 const agent=$('agent').value.trim();
 const room=$('room').value.trim().toUpperCase();
 const password=$('password').value.trim();

 socket.emit('verify_room',{agent,room,password});
}

socket.on('auth_response',d=>{
 if(!d.success){
  $('error').textContent=d.error||'ACCESS DENIED.';
  return;
 }

 currentAgent=d.agent;
 currentRoom=d.room;

 $('error').textContent='';
 $('login-screen').classList.add('hidden');
 $('chat-screen').classList.remove('hidden');

 $('active-agent').textContent='AGENT: '+currentAgent;
 $('side-room').textContent=currentRoom;
 $('chat-room').textContent=currentRoom;

 socket.emit('join_secure_chat',{
  room:currentRoom,
  agent:currentAgent
 });
});

socket.on('message',d=>{
 const div=document.createElement('div');

 if(d.system){
  div.className='message system';
  div.innerHTML='<div class="text">'+esc(d.text)+'</div>';
 }else{
  div.className=
   String(d.sender).toLowerCase()===currentAgent.toLowerCase()
   ?'message mine':'message';

  div.innerHTML=
   '<div class="sender">'+esc(d.sender)+'</div>'+
   '<div class="text">'+esc(d.text)+'</div>';
 }

 $('messages').appendChild(div);
 $('messages').scrollTop=$('messages').scrollHeight;
});

socket.on('room_user_count',d=>{
 $('online-count').textContent=d.count||0;

 $('online-users').innerHTML=(d.users||[])
  .map(x=>'<div class="online-user">'+esc(x)+'</div>')
  .join('');
});

function sendMessage(){
 const input=$('message-input');
 const text=input.value.trim();

 if(!text)return;

 socket.emit('send_message',{
  room:currentRoom,
  agent:currentAgent,
  text
 });

 input.value='';
 input.focus();
}

$('message-input').addEventListener('keydown',e=>{
 if(e.key==='Enter')sendMessage();
});

function esc(v){
 const d=document.createElement('div');
 d.textContent=v;
 return d.innerHTML;
}

function toggleSidebar(){
 $('sidebar').classList.toggle('open');
 $('backdrop').classList.toggle('show');
}

function closeSidebar(){
 $('sidebar').classList.remove('open');
 $('backdrop').classList.remove('show');
}

function triggerPanic(){
 location.href='https://en.wikipedia.org/wiki/Main_Page';
}

window.addEventListener('beforeunload',()=>{
 if(currentRoom&&currentAgent){
  socket.emit('disconnect_agent',{
   room:currentRoom,
   agent:currentAgent
  });
 }
});

document.addEventListener('contextmenu',e=>e.preventDefault());

document.addEventListener('selectstart',e=>{
 if(e.target.tagName!=='INPUT')e.preventDefault();
});

document.addEventListener('dragstart',e=>e.preventDefault());

document.addEventListener('copy',e=>{
 if(e.target.tagName!=='INPUT')e.preventDefault();
});

document.addEventListener('keydown',e=>{
 const k=e.key.toUpperCase();

 if(
  e.key==='F12'||
  (e.ctrlKey&&e.shiftKey&&['I','J','C'].includes(k))||
  (e.ctrlKey&&k==='U')
 )e.preventDefault();

 if(e.key==='Escape')closeSidebar();
});
</script>
</body>
</html>
