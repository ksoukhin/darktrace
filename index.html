<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkTrace // Secure Intelligence Network</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root {
            --bg-color: #050805;
            --terminal-green: #00ff66;
            --dim-green: #003b13;
            --alert-red: #ff3333;
            --panel-bg: #0a110a;
            --border-green: #00aa44;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Courier New', Courier, monospace; }
        body { background-color: var(--bg-color); color: var(--terminal-green); height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .agency-banner { background: #020f02; border-bottom: 2px solid var(--border-green); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; letter-spacing: 2px; }
        .panic-btn { background: var(--alert-red); color: #fff; border: none; padding: 6px 14px; font-weight: bold; cursor: pointer; letter-spacing: 1px; transition: 0.2s; }
        .panic-btn:hover { background: #ff0000; box-shadow: 0 0 10px var(--alert-red); }
        .screen { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .hidden { display: none !important; }
        .dossier-box { background: var(--panel-bg); border: 1px solid var(--border-green); padding: 30px; width: 100%; max-width: 420px; box-shadow: 0 0 20px rgba(0, 255, 102, 0.1); }
        .dossier-box h2 { text-align: center; margin-bottom: 20px; font-size: 20px; letter-spacing: 3px; border-bottom: 1px dashed var(--border-green); padding-bottom: 10px; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 11px; margin-bottom: 5px; color: #00cc52; }
        .input-group input { width: 100%; background: #000; border: 1px solid var(--border-green); color: var(--terminal-green); padding: 10px; font-size: 14px; outline: none; }
        .btn-secure { width: 100%; background: var(--dim-green); color: var(--terminal-green); border: 1px solid var(--border-green); padding: 12px; font-weight: bold; cursor: pointer; letter-spacing: 2px; margin-top: 10px; transition: 0.2s; }
        .btn-secure:hover { background: var(--border-green); color: #000; }
        .error-msg { color: var(--alert-red); font-size: 11px; margin-top: 10px; text-align: center; }
        .chat-container { display: flex; width: 100%; height: 100%; max-width: 1200px; margin: auto; border-left: 1px solid var(--dim-green); border-right: 1px solid var(--dim-green); }
        .sidebar { width: 250px; background: #030803; border-right: 1px solid var(--dim-green); padding: 20px; display: flex; flex-direction: column; }
        .sidebar h3 { font-size: 13px; margin-bottom: 15px; border-bottom: 1px solid var(--dim-green); padding-bottom: 5px; }
        .meta-info { font-size: 11px; line-height: 1.6; color: #009933; }
        .chat-main { flex: 1; display: flex; flex-direction: column; background: var(--bg-color); }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { background: #081408; border-left: 3px solid var(--border-green); padding: 10px 15px; max-width: 75%; font-size: 13px; }
        .message.system { background: transparent; border-left: 3px solid var(--alert-red); color: #ff6666; font-style: italic; max-width: 100%; text-align: center; }
        .message .sender { font-size: 10px; color: #00aa44; margin-bottom: 3px; display: block; font-weight: bold; }
        .chat-input-area { padding: 15px; background: #030803; border-top: 1px solid var(--dim-green); display: flex; gap: 10px; }
        .chat-input-area input { flex: 1; background: #000; border: 1px solid var(--border-green); color: var(--terminal-green); padding: 12px; outline: none; }
        .chat-input-area button { background: var(--dim-green); color: var(--terminal-green); border: 1px solid var(--border-green); padding: 0 20px; cursor: pointer; font-weight: bold; }
        .chat-input-area button:hover { background: var(--border-green); color: #000; }
    </style>
</head>
<body>
    <div class="agency-banner">
        <div>[STATUS: CLASSIFIED] // SYSTEM: DARKTRACE V4.2</div>
        <div>
            <span id="active-agent-display" style="margin-right: 15px;"></span>
            <button class="panic-btn" onclick="triggerPanic()">[PANIC JUMP]</button>
        </div>
    </div>
    <div id="login-screen" class="screen">
        <div class="dossier-box">
            <h2>DARKTRACE GATEWAY</h2>
            <div class="input-group">
                <label>CODENAME / ALIAS:</label>
                <input type="text" id="agent-input" placeholder="e.g., AGENT_VIPER">
            </div>
            <div class="input-group">
                <label>SECURE ROOM CODE:</label>
                <input type="text" id="room-input" placeholder="e.g., OMEGA-7">
            </div>
            <div class="input-group">
                <label>ENCRYPTION PASSKEY:</label>
                <input type="password" id="pass-input" placeholder="••••••••">
            </div>
            <button class="btn-secure" onclick="attemptLogin()">ESTABLISH CONNECTION</button>
            <div id="error-display" class="error-msg"></div>
        </div>
    </div>
    <div id="chat-screen" class="screen hidden" style="padding: 0;">
        <div class="chat-container">
            <div class="sidebar">
                <h3>OPS BRIEFING</h3>
                <div class="meta-info">
                    <p><strong>CHANNEL:</strong> <span id="lbl-room">---</span></p>
                    <p><strong>PROTOCOL:</strong> E2EE SIMULATED</p>
                    <p style="margin-top: 15px; color: var(--alert-red);">WARNING: Activity is monitored for anomaly leaks. Use panic button if compromised.</p>
                </div>
            </div>
            <div class="chat-main">
                <div id="messages-box" class="chat-messages"></div>
                <div class="chat-input-area">
                    <input type="text" id="msg-input" placeholder="Type encrypted transmission..." onkeypress="checkEnter(event)">
                    <button onclick="sendMessage()">TRANSMIT</button>
                </div>
            </div>
        </div>
    </div>
    <script>
        const socket = io();
        let currentRoom = '';
        let currentAgent = '';
        function triggerPanic() { window.location.replace("https://www.wikipedia.org"); }
        function attemptLogin() {
            const agent = document.getElementById('agent-input').value.trim();
            const room = document.getElementById('room-input').value.trim();
            const password = document.getElementById('pass-input').value.trim();
            if (!agent || !room || !password) {
                document.getElementById('error-display').innerText = "ERROR: ALL IDENTIFIERS REQUIRED.";
                return;
            }
            socket.emit('verify_room', { agent, room, password });
        }
        socket.on('auth_response', function(data) {
            if (data.success) {
                currentRoom = data.room;
                currentAgent = data.agent;
                document.getElementById('login-screen').classList.add('hidden');
                document.getElementById('chat-screen').classList.remove('hidden');
                document.getElementById('lbl-room').innerText = currentRoom;
                document.getElementById('active-agent-display').innerText = `AGENT: ${currentAgent}`;
                socket.emit('join_secure_chat', { room: currentRoom, agent: currentAgent });
            } else {
                document.getElementById('error-display').innerText = data.error;
            }
        });
        function sendMessage() {
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;
            socket.emit('send_message', { room: currentRoom, agent: currentAgent, text: text });
            input.value = '';
        }
        function checkEnter(e) { if (e.key === 'Enter') sendMessage(); }
        socket.on('message', function(data) {
            const box = document.getElementById('messages-box');
            const div = document.createElement('div');
            if (data.system) {
                div.className = 'message system';
                div.innerText = `[${data.text}]`;
            } else {
                div.className = 'message';
                div.innerHTML = `<span class="sender">${data.sender}</span>${escapeHtml(data.text)}`;
            }
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        });
        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, function(m) { return map[m]; });
        }
    </script>
</body>
</html>
